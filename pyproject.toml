[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "job-finder"
version = "1.0.0"
description = "Automated scraping, filtering, deduplication, and Discord alerting pipeline for biomedical R&D, IoT, and Health-Tech roles."
authors = [{ name = "Deepak", email = "deepakvv98@gmail.com" }]
requires-python = ">=3.10"
dependencies = [
    "python-dotenv>=1.0.1",
    "playwright>=1.47.0",
    "google-search-results>=2.4.2",
    "apify-client>=1.7.1",
    "requests>=2.32.3",
    "beautifulsoup4>=4.12.3",
    "lxml>=5.3.0",
    "aiohttp>=3.10.5",
    "tenacity>=9.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
